server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite outputs content-hashed filenames (e.g. index-DLepgvDG.js) — safe to cache
    # forever, a new build always gets new filenames.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or users get stuck on an old build that
    # references hashed asset filenames which no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing (react-router-dom) — let the SPA handle unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
